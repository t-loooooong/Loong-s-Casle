name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
      - name: Validate unattended collector
        run: node --test automation/tests.test.mjs automation/page-smoke.test.mjs
      - name: Validate subtitle matcher
        run: python -m unittest discover -s automation/parser -p 'test*.py'
